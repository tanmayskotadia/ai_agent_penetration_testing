name: ZAP Baseline Scan

on:
  workflow_dispatch:
    inputs:
      target:
        description: "URL of an app you own or are authorized to test"
        required: true
        default: "https://your-app.onrender.com"

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare report folder
        run: |
          mkdir -p zap-wrk
          chmod 777 zap-wrk

      - name: Run ZAP baseline scan
        env:
          TARGET: ${{ inputs.target }}
        run: |
          docker run --rm -v "$(pwd)/zap-wrk:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$TARGET" \
            -J report_json.json -r report_html.html -I

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan
          path: zap-wrk/
