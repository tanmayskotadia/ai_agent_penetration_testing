services:
  - type: web
    name: dataops
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh /app/render-start.sh
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_OPERATOR_TOKENS
        value: "false"
      - key: APP_SECRET
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: EVIDENCE_KEY_ID
        value: primary-v1
      - key: EVIDENCE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
